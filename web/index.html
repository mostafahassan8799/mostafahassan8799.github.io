  <style>
    html, body { margin: 0; height: 100%; background: #0A0F1A; }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #94A0B8; transition: opacity .4s ease;
    }
    #loader b { color: #E8EDF6; font-size: 20px; letter-spacing: -.02em; }
    #loader b span { color: #4FB3FF; }
    .bar { width: 160px; height: 3px; border-radius: 3px; background: #1F2A3D; overflow: hidden; }
    .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #4FB3FF, #54C5F8);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="loader" aria-live="polite">
    <b>Mostafa<span>.</span>dev</b>
    <div class="bar"></div>
    <small>Loading a portfolio built with Flutter…</small>
  </div>

  <!-- Readable fallback for crawlers and no-JS visitors -->
  <noscript>
    <h1>Mostafa Hassan - Senior Flutter Developer</h1>
    <p>4+ years shipping production Flutter apps on iOS, Android and Huawei AppGallery.

    <p>Contact: mostafahassan8799@gmail.com ·

      <a href="Mostafa_Hassan_Flutter_Developer_CV.pdf">CV (PDF)</a></p>
  </noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loader');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
